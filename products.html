<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octet — Catalogue</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
    <div class="mx-auto w-full max-w-5xl px-4">
      <div class="flex h-16 items-center gap-3 sm:gap-4">
        <a class="shrink-0 text-lg font-bold text-slate-900" href="index.html">Octet<span class="text-brand">.</span></a>

        <!-- La recherche est un vrai formulaire GET : le navigateur construit
             lui-même l'adresse products.html?search=… , aucun JavaScript n'est
             nécessaire pour la faire fonctionner. -->
        <form class="min-w-0 flex-1" action="products.html" method="get" role="search">
          <input class="input" type="search" name="search" id="header-search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit">
        </form>

        <!-- Rempli par initAuth() : « Connexion » ou le prénom du visiteur. -->
        <nav class="flex shrink-0 items-center gap-3 text-sm" data-account></nav>

        <a class="flex shrink-0 items-center gap-1.5 text-sm text-slate-600 hover:text-brand" href="cart.html">
          <span class="hidden sm:inline">Panier</span>
          <span class="text-base sm:hidden" aria-hidden="true">🛒</span>
          <span class="inline-block min-w-5 rounded-full bg-brand px-1.5 text-center text-xs text-white" data-cart-count hidden>0</span>
        </a>
      </div>

      <nav class="flex gap-5 overflow-x-auto pb-2 text-sm" data-departments></nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl px-4 py-8">
    <h1 class="mb-5 text-2xl font-bold text-slate-900">Catalogue</h1>

    <!-- Barre de filtres. Aucun bouton « Appliquer » : chaque changement
         recharge la liste immédiatement (voir js/products.js).
         La recherche n'est plus ici, elle est dans l'en-tête de toutes les
         pages, comme sur un vrai site marchand. -->
    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end">
      <div class="sm:flex-1">
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="category">Catégorie</label>
        <!-- Les options, groupées par département, sont ajoutées par
             JavaScript après l'appel à api/categories.php. -->
        <select class="input" id="category" name="category">
          <option value="">Toutes les catégories</option>
        </select>
      </div>

      <div class="sm:w-56">
        <label class="mb-1 block text-sm font-semibold text-slate-700" for="sort">Trier par</label>
        <select class="input" id="sort" name="sort">
          <option value="name">Nom</option>
          <option value="price">Prix croissant</option>
          <option value="id">Nouveautés</option>
          <option value="popular">Les plus commandés</option>
        </select>
      </div>

      <label class="flex items-center gap-2 pb-2.5 text-sm text-slate-700" for="promo">
        <input class="h-4 w-4 accent-brand" type="checkbox" id="promo" name="promo">
        Promotions uniquement
      </label>
    </div>

    <div class="alert" id="message" hidden></div>

    <p class="py-5 text-slate-500" id="loading">Chargement du catalogue…</p>
    <p class="py-5 text-slate-500" id="empty" hidden>Aucun produit ne correspond à ces filtres.</p>

    <!-- Grille remplie par js/products.js : une colonne sur mobile, deux à
         partir de 640 px, trois à partir de 1024 px. -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3" id="product-grid"></div>
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-sm text-slate-500">
    <div class="mx-auto w-full max-w-5xl px-4">
      <p>Projet pédagogique — boutique fictive, aucun paiement réel.</p>
    </div>
  </footer>

  <!-- L'ordre compte : la page utilise les fonctions des fichiers précédents. -->
  <script src="js/cart-storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/products.js"></script>
</body>
</html>

# =============================================================
#  GitHub Pages — vitrine statique, validée par Docker Compose
#
#  Rappel : GitHub Pages ne peut servir QUE des fichiers statiques,
#  il n'exécute ni PHP ni MySQL. Ce workflow publie donc toujours les
#  pages HTML/CSS/JS : les données dynamiques (comptes, panier,
#  commandes) s'appuient sur l'API PHP et afficheront des erreurs.
#
#  La différence avec une simple copie des fichiers : avant de publier,
#  le workflow démarré le VRAI site via docker-compose.yml — le conteneur
#  MySQL (db) et le conteneur PHP/Apache (web) — et vérifie qu'il répond
#  (page d'accueil + endpoint API qui lit en base). La publication sort
#  donc du même fichier que celui utilisé en local : ce qui casse la pile
#  Docker ne part jamais en production.
#
#  Le site réellement fonctionnel (PHP + MySQL) vit dans Docker, sur une
#  plateforme qui lance des conteneurs (voir README.md → "Déploiement
#  continu du site fonctionnel").
#
#  Activation (une fois, dans le repo) :
#    Settings → Pages → Build and deployment → Source : "GitHub Actions".
#  Ensuite, chaque push sur main déclenche ce workflow, qui publie le site sur
#  https://<utilisateur>.github.io/<repo>/.
# =============================================================

name: Pages — vitrine statique (vérifiée via Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Droits nécessaires à actions/deploy-pages : publier la page (pages) et
# s'authentifier auprès de GitHub (id-token). Le reste est en lecture seule.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement Pages à la fois : un push annule le précédent au lieu
# d'en empiler deux.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le CSS est un fichier Tailwind compilé : il est régénéré ici à partir
      # de src/input.css. Cette étape reste hors Docker car l'image web
      # (php:8.4-apache) n'emporte pas Node ; c'est le seul outil host que le
      # projet utilise pour produire un fichier de la vitrine.
      - name: Set up Node (build CSS)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CSS
        run: npm run css

      # La mise en route passe par docker-compose.yml — PAS par une recopie
      # des commandes du README. C'est exactement le même fichier qu'en local :
      # mêmes images, mêmes variables d'environnement, mêmes volumes. Le
      # "depends_on: db (service_healthy)" de docker-compose.yml fait attendre
      # le conteneur web que la base ait fini son import initial.
      # ubuntu-latest embarque Docker + Docker Compose v2.
      - name: Build and start the Docker stack (docker-compose.yml)
        run: docker compose up -d --build

      # Les volumes de docker-compose.yml montent ./ dans /var/www/html : le
      # conteneur web sert donc directement le CSS fraîchement compilé.
      # Ce test lit le site À travers la pile complète : un vocabulaire
      # Apache ne suffit pas, l'API doit prouver que PHP + pdo_mysql + le
      # schéma importé fonctionnent ensemble.
      - name: Smoke test — la pile Docker répond (page + API + base)
        run: |
          # Apache peut mettre un instant à répondre après le démarrage du
          # conteneur : on relit jusqu'à 30×2 s avant de conclure.
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://localhost:8080/index.html; then
              break
            fi
            sleep 2
          done

          # 1) La page d'accueil est servie par le conteneur web.
          curl -fs -o /dev/null http://localhost:8080/index.html

          # 2) Un endpoint qui lit en base et répond {"success":true,...} : il
          #    prouve PHP, pdo_mysql et l'import du schéma en un aller-retour.
          #    json_encode() produit du JSON compact (sans espace après les
          #    deux-points), d'où le motif "success":true.
          #    La réponse est écrite dans un fichier puis vérifiée avec grep :
          #    sans pipe, car avec "-o pipefail" un grep -q qui ferme le tuyau
          #    ferait échouer curl (SIGPIPE) même si la réponse était bonne.
          curl -fs http://localhost:8080/api/categories.php -o /tmp/categories.json
          grep -q '"success":true' /tmp/categories.json

      # On ne publie que la vitrine : les fichiers HTML, le CSS et le JS.
      # Tout le reste (API PHP, base, sources Tailwind, node_modules) reste
      # dans le dépôt mais n'a rien à faire sur la page.
      - name: Stage static files
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r css js _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
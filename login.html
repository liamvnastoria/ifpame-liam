<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octet — Connexion</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
    <div class="mx-auto w-full max-w-5xl px-4">
      <div class="flex h-16 items-center gap-3 sm:gap-4">
        <a class="shrink-0 text-lg font-bold text-slate-900" href="index.html">Octet<span class="text-brand">.</span></a>

        <form class="min-w-0 flex-1" action="products.html" method="get" role="search">
          <input class="input" type="search" name="search" id="header-search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit">
        </form>

        <!-- Sur cette page, l'en-tête affiche aussi « Connexion » : c'est
             initAuth() qui remplit cette zone, même ici. -->
        <nav class="flex shrink-0 items-center gap-3 text-sm" data-account></nav>

        <a class="flex shrink-0 items-center gap-1.5 text-sm text-slate-600 hover:text-brand" href="cart.html">
          <span class="hidden sm:inline">Panier</span>
          <span class="text-base sm:hidden" aria-hidden="true">🛒</span>
          <span class="inline-block min-w-5 rounded-full bg-brand px-1.5 text-center text-xs text-white" data-cart-count hidden>0</span>
        </a>
      </div>

      <nav class="flex gap-5 overflow-x-auto pb-2 text-sm" data-departments></nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl px-4 py-12">
    <section class="mx-auto max-w-md">
      <h1 class="mb-5 text-2xl font-bold text-slate-900">Connexion</h1>

      <div class="alert" id="message" hidden></div>

      <form class="panel" id="login-form" novalidate>
        <div class="field">
          <label for="email">Adresse e-mail</label>
          <input class="input" type="email" id="email" name="email" maxlength="150" required autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input class="input" type="password" id="password" name="password" maxlength="72" required autocomplete="current-password">
        </div>

        <button class="btn btn-primary" type="submit" id="submit-login">Se connecter</button>
      </form>

      <p class="mt-4 text-sm text-slate-500">
        Pas encore de compte ?
        <a class="text-brand hover:underline" href="register.html">Créer un compte</a>
      </p>

      <!-- Comptes livrés avec les données de démonstration (database/schema.sql).
           Utile pour l'évaluation : on peut voir un historique de commandes sans
           devoir commander soi-même. -->
      <div class="alert alert-info mt-6">
        <p class="font-semibold">Comptes de démonstration</p>
        <p class="mt-1">marie.dupont@example.com — mot de passe : demo1234</p>
        <p>karim.benali@example.com — mot de passe : demo1234</p>
      </div>
    </section>
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-sm text-slate-500">
    <div class="mx-auto w-full max-w-5xl px-4">
      <p>Projet pédagogique — boutique fictive, aucun paiement réel.</p>
    </div>
  </footer>

  <script src="js/cart-storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // La logique des formulaires est dans js/auth.js : les pages ne font que
    // lancer ce dont elles ont besoin.
    initAuth();
    initLoginForm();
  </script>
</body>
</html>

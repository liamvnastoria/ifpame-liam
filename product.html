<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Octet — Fiche produit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">

  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white">
    <div class="mx-auto w-full max-w-5xl px-4">
      <div class="flex h-16 items-center gap-3 sm:gap-4">
        <a class="shrink-0 text-lg font-bold text-slate-900" href="index.html">Octet<span class="text-brand">.</span></a>

        <form class="min-w-0 flex-1" action="products.html" method="get" role="search">
          <input class="input" type="search" name="search" id="header-search" placeholder="Rechercher un produit…" aria-label="Rechercher un produit">
        </form>

        <!-- Rempli par initAuth() : « Connexion » ou le prénom du visiteur. -->
        <nav class="flex shrink-0 items-center gap-3 text-sm" data-account></nav>

        <a class="flex shrink-0 items-center gap-1.5 text-sm text-slate-600 hover:text-brand" href="cart.html">
          <span class="hidden sm:inline">Panier</span>
          <span class="text-base sm:hidden" aria-hidden="true">🛒</span>
          <span class="inline-block min-w-5 rounded-full bg-brand px-1.5 text-center text-xs text-white" data-cart-count hidden>0</span>
        </a>
      </div>

      <nav class="flex gap-5 overflow-x-auto pb-2 text-sm" data-departments></nav>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl px-4 py-8">
    <p class="mb-5 text-sm"><a class="text-brand hover:underline" href="products.html">← Retour au catalogue</a></p>

    <div class="alert" id="message" hidden></div>

    <p class="py-5 text-slate-500" id="loading">Chargement du produit…</p>

    <!-- Contenu rempli par js/product.js. La structure est déjà là : le
         JavaScript ne fait que la remplir et la démasquer.
         Une seule colonne sur mobile, deux à partir de 1024 px. -->
    <article class="grid gap-8 lg:grid-cols-2" id="product-detail" hidden>
      <div class="overflow-hidden rounded-xl" id="product-image"></div>

      <div>
        <p class="product-card-category" id="product-category"></p>
        <h1 class="mb-0 text-2xl font-bold text-slate-900" id="product-name"></h1>
        <p class="mt-4 mb-2 text-2xl font-bold" id="product-price"></p>
        <p id="product-stock"></p>
        <!-- whitespace-pre-line conserve les retours à la ligne du texte
             enregistré en base. -->
        <p class="whitespace-pre-line text-slate-500" id="product-description"></p>

        <div class="mt-5 flex flex-wrap items-end gap-3">
          <div>
            <label class="mb-1 block text-sm text-slate-500" for="quantity">Quantité</label>
            <input class="input w-24" type="number" id="quantity" value="1" min="1" step="1">
          </div>
          <button class="btn btn-primary" type="button" id="add-to-cart">Ajouter au panier</button>
          <a class="btn btn-ghost" href="cart.html">Voir le panier</a>
          <!-- Bouton de liste d'envies, rempli par js/product-social.js -->
          <button class="btn btn-ghost" type="button" id="wishlist-toggle" hidden></button>
        </div>
      </div>
    </article>

    <!-- Avis clients : le contenu est construit par js/product-social.js. -->
    <section class="mt-10" id="reviews-section">
      <h2 class="text-xl font-bold text-slate-900">Avis clients</h2>
      <p class="mt-1 text-slate-600" id="reviews-summary"></p>

      <!-- Formulaire réservé aux comptes connectés. -->
      <div class="panel mt-4" id="review-form-box" hidden>
        <h3 class="font-semibold text-slate-900">Donner mon avis</h3>
        <form class="mt-3" id="review-form" novalidate>
          <div class="field">
            <label for="review-rating">Note</label>
            <select class="input" id="review-rating" name="rating">
              <option value="5">5 — Excellent</option>
              <option value="4">4 — Très bien</option>
              <option value="3">3 — Correct</option>
              <option value="2">2 — Décevant</option>
              <option value="1">1 — Très décevant</option>
            </select>
          </div>
          <div class="field">
            <label for="review-comment">Commentaire (facultatif)</label>
            <textarea class="input" id="review-comment" name="comment" rows="4" maxlength="1000"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Publier mon avis</button>
        </form>
      </div>

      <!-- Affiche un lien de connexion quand personne n'est connecté. -->
      <p class="note mt-3" id="review-login" hidden>
        Connectez-vous pour laisser un avis :
        <a class="text-brand hover:underline" href="login.html">se connecter</a>.
      </p>

      <p class="py-3 text-slate-500" id="reviews-empty" hidden>
        Aucun avis pour le moment. Soyez le premier à donner votre avis.
      </p>

      <ul class="mt-4 space-y-4" id="reviews-list"></ul>
    </section>
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-sm text-slate-500">
    <div class="mx-auto w-full max-w-5xl px-4">
      <p>Projet pédagogique — boutique fictive, aucun paiement réel.</p>
    </div>
  </footer>

  <script src="js/cart-storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/product.js"></script>
  <script src="js/product-social.js"></script>
</body>
</html>
